---
layout: default
title: Blog
permalink: /blog/
---
<h1 class="post-title">Blog</h1>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <span class="post-list-date">{{ post.date | date: "%b %-d, %Y" }}</span>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
