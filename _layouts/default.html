<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {% seo %}

    <link rel="shortcut icon" href="{{ '/images/favicon/favicon.ico' | relative_url }}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="{{ '/stylesheet.css' | relative_url }}">

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']],
          processEscapes: true,
          tags: 'ams'
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>

  <body>
    <div class="page">

      <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}">Jialin Li</a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Home</a> &nbsp;/&nbsp;
          <a href="{{ '/blog/' | relative_url }}">Blog</a> &nbsp;/&nbsp;
          <a href="{{ '/resources.html' | relative_url }}">Resources</a>
        </nav>
      </header>

      <main class="content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <p>Based on this <a href="https://jonbarron.info/">website</a>.</p>
      </footer>

    </div>
  </body>
</html>
